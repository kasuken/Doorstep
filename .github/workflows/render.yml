# Optional: render the dashboard in GitHub Actions and publish it on GitHub Pages,
# so no computer at home has to stay on. Enable Pages with "Source: GitHub Actions".
name: Render Kindle dashboard

on:
  schedule:
    # 20 min before each Kindle wake-up (03/07/11/15/19/23 Zurich time),
    # listed for both winter (UTC+1) and summer (UTC+2). Cron here is UTC.
    - cron: "40 0,1,4,5,8,9,12,13,16,17,20,21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get install -y fonts-dejavu-core
      - run: npm ci
      - run: node src/render.js site/dashboard.png
      - run: |
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="14400">
          <title>Entrance display</title><body style="margin:0;text-align:center">
          <img src="dashboard.png" width="600" height="800" alt="Dashboard"></body>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
